name: Update Leaderboard

on:
  # Manual trigger only — run from the GitHub Actions tab (or the gh
  # CLI). Deliberately no schedule: Wally pushes this himself, so every
  # run reflects an intentional update rather than a clock tick.
  workflow_dispatch:
    inputs:
      retrain:
        description: 'Full Stuff+ retrain (~30-40 min) instead of scoring with the cached fold models (~1 min). Retrain weekly-ish or after model changes.'
        type: boolean
        default: false

permissions:
  contents: write

# Don't let two leaderboard runs race each other onto main.
concurrency:
  group: update-leaderboard
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install 'gspread>=6.0,<7.0' 'google-auth>=2.0,<3.0' numpy pandas scikit-learn 'xgboost==3.3.0'

      - name: Fetch data and build leaderboard
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          # Lets fg_overrides fall back to the encrypted release copy when
          # FanGraphs blocks the runner, instead of ending up with no cache
          # at all. Without this the fallback dies on a missing key.
          STUFF_DATA_KEY: ${{ secrets.STUFF_DATA_KEY }}
        run: python3 process_data.py

      # Stuff+ is an offline-trained model (needs xgboost), so it runs here
      # rather than inside process_data.py. It trains on the fresh pickle that
      # process_data.py just built, injects scores into the leaderboard JSONs,
      # then rebuild_embed.py swaps those into data_core.json.gz (which
      # process_data.py built with the previous run's preserved scores).
      - name: Fetch prior-season training data (encrypted release asset)
        # The 2025 retagged training set travels as AES-256 ciphertext on the
        # public release; only CI (STUFF_DATA_KEY secret) and Wally's .env can
        # decrypt. See scripts/build_2025_training_set.py for provenance.
        # Retrain runs only — score-only runs need no training data at all.
        if: ${{ inputs.retrain }}
        env:
          STUFF_DATA_KEY: ${{ secrets.STUFF_DATA_KEY }}
        run: |
          # -f/--retry for the same reason as the model bundle below: without
          # -f an HTTP error body lands in p25.enc and surfaces as an openssl
          # decrypt failure, which reads like a bad key rather than a bad
          # download.
          curl -sfL --retry 3 --retry-delay 5 --retry-all-errors -o /tmp/p25.enc \
            https://github.com/wjhuron/Huronalytics/releases/download/latest-data/_pitches2025_training.pkl.enc \
            && openssl enc -d -aes-256-cbc -pbkdf2 -pass env:STUFF_DATA_KEY \
                 -in /tmp/p25.enc -out data/_pitches2025_training.pkl \
            || echo "prior-season asset unavailable — trainer will fall back"

      - name: Fetch 2021-24 volume prior (plain release assets)
        # Public-Statcast reconstructions (scripts/
        # build_historical_training_set.py) — no retagged IP, so no
        # encryption needed, unlike the 2025 set above. Adopted 2026-07-13
        # (multi-season prior beat 2025-only on all three objectives; see
        # train_stuff.HIST_YEARS). Missing assets degrade gracefully —
        # the trainer skips absent seasons. Retrain runs only.
        if: ${{ inputs.retrain }}
        run: |
          for yr in 2021 2022 2023 2024; do
            curl -sfL --retry 3 --retry-delay 5 --retry-all-errors -o /tmp/p${yr}.gz \
              https://github.com/wjhuron/Huronalytics/releases/download/latest-data/_pitches${yr}_training.pkl.gz \
              && gunzip -c /tmp/p${yr}.gz > data/_pitches${yr}_training.pkl \
              || echo "${yr} asset unavailable — trainer will skip it"
          done

      - name: Fetch cached model bundle (score-only runs)
        # The bundle carries the pitcher-grouped OOF fold models from the last
        # full retrain. Scoring with them is leakage-free for new pitches
        # (each fold model never saw its assigned pitchers' 2026 data), so
        # normal leaderboard updates skip the ~30-min retrain entirely.
        if: ${{ !inputs.retrain }}
        run: |
          # -f so an HTTP error is a curl failure rather than an error page
          # written to bundle.gz (which would surface only as a confusing
          # gunzip error), and --retry so a transient blip does not cost the
          # run its Stuff+ scores. A bare `curl -sL` failed once in ~1s on
          # 2026-08-12 and, with the old sheets_write_grades guard, blanked
          # the Stuff+/Pitching+ columns in every workbook.
          curl -sfL --retry 3 --retry-delay 5 --retry-all-errors -o /tmp/bundle.gz \
            https://github.com/wjhuron/Huronalytics/releases/download/latest-data/stuff_models.pkl.gz \
            && gunzip -c /tmp/bundle.gz > stuff_plus/stuff_models.pkl \
            || echo "bundle unavailable — Stuff+ step will fall back to preserved scores"

      - name: Refresh 2026 kinematics sidecar (v13 kin_eff__ff)
        # The sheets carry no kinematics, so 2026 KinEff rides a PitchID
        # sidecar. Fetch the published cache + sidecar, then top up only the
        # dates Savant has that the cache lacks (a couple of small CSV pulls
        # on a normal day). A refresh failure degrades to the downloaded
        # sidecar (scores drift toward each pitcher's own FF mean for the
        # newest games only); an absent sidecar aborts retrains in the
        # trainer itself.
        run: |
          curl -sfL --retry 3 --retry-delay 5 --retry-all-errors -o /tmp/kin_cache.gz \
            https://github.com/wjhuron/Huronalytics/releases/download/latest-data/_statcast2026_kin_cache.pkl.gz \
            && gunzip -c /tmp/kin_cache.gz > data/_statcast2026_kin_cache.pkl \
            || echo "kin cache asset unavailable — builder will fetch from scratch"
          curl -sfL --retry 3 --retry-delay 5 --retry-all-errors -o /tmp/kin_side.gz \
            https://github.com/wjhuron/Huronalytics/releases/download/latest-data/kinematics_2026_sidecar.pkl.gz \
            && gunzip -c /tmp/kin_side.gz > data/kinematics_2026_sidecar.pkl \
            || echo "sidecar asset unavailable"
          python3 scripts/build_kinematics_2026.py \
            || echo "kinematics refresh failed — using downloaded sidecar as-is"

      - name: Compute Stuff+ (retrain or cached-model scoring, inject into leaderboards)
        # Retrain path needs the 2025 pickle (retraining without it would
        # silently regress to the weaker 2026-only config). Score-only path
        # needs the bundle. Either absent -> carry the last injected scores
        # forward (process_data.py preserves them).
        run: |
          if [ "${{ inputs.retrain }}" = "true" ]; then
            if [ -f data/_pitches2025_training.pkl ]; then
              python3 stuff_plus/train_stuff.py --inject --dump-pitch-grades data/pitch_stuff_grades.json
            else
              echo "prior-season pickle absent — keeping preserved Stuff+ scores"
            fi
          else
            if [ -f stuff_plus/stuff_models.pkl ]; then
              python3 stuff_plus/train_stuff.py --score-only --inject --dump-pitch-grades data/pitch_stuff_grades.json
            else
              echo "model bundle absent — keeping preserved Stuff+ scores"
            fi
          fi

      # Micro data was generated mid-process_data with the PREVIOUS run's
      # Stuff+ dump — rebuild it now that this run's dump exists, so filtered
      # site views (grade atoms) never lag the sheets/cards by a cycle.
      - name: Refresh micro-data grade atoms
        run: python3 scripts/refresh_micro_grades.py

      - name: Rebuild embedded payload with injected Stuff+
        run: python3 scripts/rebuild_embed.py

      # Per-pitch Stuff+/Loc+/Pitching+ -> the Sheets grade columns (cols
      # 24-26 after HAA). Full-column overwrite each run (retags / late arm angles /
      # retrains self-heal). continue-on-error: a Sheets quota hiccup must not
      # block the site publish — the next run rewrites everything anyway.
      - name: Write per-pitch grades back to Sheets
        continue-on-error: true
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.SERVICE_ACCOUNT_JSON }}
        run: python3 scripts/sheets_write_grades.py

      # Gate the publish on real output integrity — same script Wally can
      # run locally after a pipeline run (checks leaderboard JSONs and both
      # embed chunks of the 2026-07-29 core/heavy split).
      - name: Validate output integrity
        run: python3 scripts/validate_output.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # cache-file merge driver (see .gitattributes): auto-resolve
          # generated caches during the rebase-retry loop below
          git config merge.theirs.driver "cp -f %B %A"
          git add data/ index.html css/ js/
          if git diff --cached --quiet; then
            echo "No changes to deploy."
          else
            git commit -m "Update leaderboard $(date '+%Y-%m-%d %H:%M')"

            # Retry on non-fast-forward: if a concurrent push landed on main
            # while we were running, rebase the leaderboard commit on top and
            # try again. Five attempts is enough headroom for any realistic
            # race; if we still can't push after that, surface the error.
            for attempt in 1 2 3 4 5; do
              if git push origin main; then
                break
              fi
              echo "Push attempt $attempt rejected, rebasing on origin/main and retrying..."
              # --autostash: the pipeline leaves unstaged changes in tracked
              # files outside the committed set; without it the rebase refuses
              # to run ("You have unstaged changes") and the retry dies
              if ! git pull --rebase --autostash origin main; then
                # Expected collision: bump_asset_version rewrites every ?v=
                # stamp in index.html both locally and in CI, so a mid-run
                # push always conflicts there. Resolve by taking main's copy
                # (keeps any human edits) and re-stamping it fresh.
                restamped=false
                if git status --porcelain | grep -q "^UU index.html$"; then
                  git checkout --ours -- index.html
                  sed -E -i "s/\?v=[A-Za-z0-9_-]+/?v=$(date +%Y%m%d%H%M%S)/g" index.html
                  git add -- index.html
                  restamped=true
                fi
                if [ "$restamped" = true ] && git -c core.editor=true rebase --continue; then
                  echo "Resolved ?v= stamp conflict against main and continued."
                else
                  echo "Unresolvable rebase conflict — aborting:"
                  git status --porcelain
                  git rebase --abort
                  exit 1
                fi
              fi
              if [ $attempt -eq 5 ]; then
                echo "Push still failing after 5 attempts."
                exit 1
              fi
            done
          fi

      # Publish the pickle cache as a GitHub Release asset. The pickle is
      # gitignored (it's ~100 MB, too big for git) but downstream tools like
      # HitterCards.py depend on it for per-pitch data. Without this step,
      # local clones can never get a fresh pickle from CI — they'd have to
      # run process_data.py locally, which means re-fetching everything
      # from Google Sheets. Attaching to a fixed-tag release lets the
      # card auto-download the latest pickle in seconds.
      - name: Publish refreshed model bundle (retrain runs)
        # Fold models + assignments for the score-only path above. Plain
        # asset: the bundle is trained-model weights, no retagged pitch data.
        if: ${{ success() && inputs.retrain }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gzip -c stuff_plus/stuff_models.pkl > /tmp/stuff_models.pkl.gz
          gh release upload latest-data /tmp/stuff_models.pkl.gz --clobber

      - name: Publish refreshed kinematics sidecar
        # Public-Statcast-derived (like the 2021-24 training assets), so
        # plain gzip, no encryption. Published every run so the next run's
        # incremental top-up stays a couple of CSV pulls.
        if: ${{ success() && hashFiles('data/kinematics_2026_sidecar.pkl') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gzip -c data/kinematics_2026_sidecar.pkl > /tmp/kinematics_2026_sidecar.pkl.gz
          gzip -c data/_statcast2026_kin_cache.pkl > /tmp/_statcast2026_kin_cache.pkl.gz
          gh release upload latest-data /tmp/kinematics_2026_sidecar.pkl.gz --clobber
          gh release upload latest-data /tmp/_statcast2026_kin_cache.pkl.gz --clobber

      - name: Encrypt pickle for publication
        # The retagged pitch data ships as AES-256 ciphertext only
        # (STUFF_DATA_KEY decrypts: repo secret in CI, .env locally).
        if: success()
        env:
          STUFF_DATA_KEY: ${{ secrets.STUFF_DATA_KEY }}
        run: |
          openssl enc -aes-256-cbc -pbkdf2 -pass env:STUFF_DATA_KEY \
            -in data/all_pitches_rs_cache.pkl -out data/all_pitches_rs_cache.pkl.enc
          # Same treatment for the FG override cache: the repo is public and
          # this is a third party's leaderboard data, so it ships encrypted.
          # It is gitignored AND only written when the FanGraphs fetch
          # succeeds, so on a run where FanGraphs blocks the runner the file
          # simply does not exist — that must not fail the whole pipeline.
          if [ -f data/fg_overrides.json ]; then
            openssl enc -aes-256-cbc -pbkdf2 -pass env:STUFF_DATA_KEY \
              -in data/fg_overrides.json -out data/fg_overrides.json.enc
          else
            echo "::warning::data/fg_overrides.json absent (FanGraphs fetch failed) — skipping its release upload"
          fi

      - name: Publish pickle to "latest-data" release
        if: success()
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest-data
          name: Latest pipeline pickle
          body: |
            Automated upload from the most recent pipeline run.

            - all_pitches_rs_cache.pkl.enc — pitch-level cache;
              HitterCards.py downloads it when the local pickle is stale.
            - fg_overrides.json.enc — the FanGraphs override cache as CI
              last fetched it. The cache is gitignored, so a machine that
              FanGraphs' Cloudflare bot scoring challenges has no other
              route to fresh values; fg_overrides.refresh_if_stale falls
              back to this copy when the direct fetch fails. Only uploaded
              on runs where the fetch actually succeeded, so it holds the
              last known good values rather than being overwritten by a
              blocked run.

            Updated: ${{ github.event.repository.updated_at }}
          files: data/all_pitches_rs_cache.pkl.enc
          fail_on_unmatched_files: true
          make_latest: false

      # Separate step, and deliberately NOT fatal: the FG cache exists only
      # when the FanGraphs fetch succeeded. Bundling it with the pickle above
      # meant a blocked FanGraphs run failed the entire pipeline.
      - name: Publish FG override cache (only when freshly fetched)
        if: success() && hashFiles('data/fg_overrides.json.enc') != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest-data
          files: data/fg_overrides.json.enc
          fail_on_unmatched_files: false
          make_latest: false
